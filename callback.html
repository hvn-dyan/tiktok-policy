<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok OAuth Callback</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121820;
      --line: #2a3544;
      --text: #e7ecf3;
      --muted: #8a97a8;
      --ok: #22c55e;
      --err: #fe2c55;
      --cyan: #25f4ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(37,244,238,.08), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(254,44,85,.07), transparent 50%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: linear-gradient(180deg, #161d27, var(--card));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    .ok h1 { color: var(--ok); }
    .err h1 { color: var(--err); }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 16px; font-size: .95rem; }
    label {
      display: block;
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0c1219;
      color: var(--text);
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .82rem;
      line-height: 1.45;
      word-break: break-all;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: .9rem;
    }
    .primary {
      background: linear-gradient(135deg, var(--cyan), #1ad4cf 40%, var(--err));
      color: #061016;
    }
    .ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
    }
    .hint {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: .82rem;
      color: var(--muted);
    }
    .meta { font-size: .8rem; color: var(--muted); margin-top: 10px; word-break: break-all; }
    #toast {
      display: none;
      margin-top: 12px;
      color: var(--ok);
      font-size: .9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Đang đọc callback…</h1>
    <p id="message">Vui lòng chờ.</p>

    <div id="successBlock" style="display:none">
      <label for="codeBox">Authorization code — copy rồi dán vào Terminal / app</label>
      <textarea id="codeBox" readonly></textarea>
      <div class="actions">
        <button type="button" class="primary" id="btnDownload">Tải file tiktok_auth_code.txt</button>
        <button type="button" class="ghost" id="btnCopy">Copy code</button>
        <button type="button" class="ghost" id="btnCopyUrl">Copy cả URL</button>
      </div>
      <div id="toast">Đã copy vào clipboard.</div>
      <div class="meta" id="stateLine"></div>
      <div class="hint">
        <strong>Khuyên dùng:</strong> bấm «Tải file…» → chuyển file vào thư mục project
        (<code>tool-video/tiktok_auth_code.txt</code> → Terminal chạy
        <code>uv run vf-tiktok-login</code> → nhấn Enter (để trống) để đọc file.
        Code chỉ dùng được một lần.
      </div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");
      const errorDescription = params.get("error_description");
      const scopes = params.get("scopes");

      const card = document.getElementById("card");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const successBlock = document.getElementById("successBlock");
      const codeBox = document.getElementById("codeBox");
      const stateLine = document.getElementById("stateLine");
      const toast = document.getElementById("toast");

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (_) {
          codeBox.focus();
          codeBox.select();
          document.execCommand("copy");
        }
        toast.style.display = "block";
        toast.textContent = "Đã copy vào clipboard.";
        setTimeout(() => { toast.style.display = "none"; }, 2500);
      }

      function downloadCodeFile(text) {
        const blob = new Blob([text + "\n"], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "tiktok_auth_code.txt";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
        toast.style.display = "block";
        toast.textContent = "Đã tải tiktok_auth_code.txt — đưa vào thư mục tool-video rồi Enter trên Terminal.";
        setTimeout(() => { toast.style.display = "none"; }, 4000);
      }

      if (error) {
        card.classList.add("err");
        title.textContent = "Ủy quyền thất bại";
        message.textContent = decodeURIComponent(errorDescription || error);
        return;
      }

      if (!code) {
        card.classList.add("err");
        title.textContent = "Không thấy authorization code";
        message.textContent =
          "URL thiếu tham số ?code=. Hãy đăng nhập lại từ ứng dụng (vf-tiktok-login).";
        return;
      }

      // URLSearchParams đã decode %2A → * ; giữ nguyên giá trị này khi gửi token.
      const decodedCode = code;
      card.classList.add("ok");
      title.textContent = "Đăng nhập thành công";
      message.textContent =
        "Tải file code (an toàn hơn) hoặc copy rồi đưa vào ứng dụng / Terminal.";
      successBlock.style.display = "block";
      codeBox.value = decodedCode;
      stateLine.textContent =
        (state ? "state: " + state + " · " : "") +
        (scopes ? "scopes: " + decodeURIComponent(scopes) : "");

      document.getElementById("btnDownload").addEventListener("click", () => downloadCodeFile(decodedCode));
      document.getElementById("btnCopy").addEventListener("click", () => copyText(decodedCode));
      document.getElementById("btnCopyUrl").addEventListener("click", () => copyText(window.location.href));

      codeBox.focus();
      codeBox.select();
    })();
  </script>
</body>
</html>
